<div class="entry-card rounded-lg border border-slate-200 bg-white p-4 shadow-sm sm:p-5">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <p class="text-xs font-semibold uppercase tracking-[0.16em] text-emerald-700">Guard Entry</p>
      <h2 class="mt-1 text-2xl font-semibold text-text-900">New Parking Ticket</h2>
    </div>

    <div class="w-fit rounded-md border border-slate-200 bg-slate-50 px-3 py-2 text-sm font-semibold text-slate-700">
      {{ now$ | async | date:'MMM d, yyyy' }}
      <span class="mx-1 text-slate-300">|</span>
      {{ now$ | async | date:'hh:mm:ss a' }}
    </div>
  </div>

  <form [formGroup]="entryForm" (ngSubmit)="onSubmit()" class="mt-5">
    <div class="grid gap-3 md:grid-cols-[0.8fr_1.2fr]">
      <mat-form-field class="entry-field w-full" appearance="outline">
        <mat-label>Vehicle Type</mat-label>
        <mat-select formControlName="vehicleType">
          <mat-option value="CAR">CAR</mat-option>
          <mat-option value="MOTORCYCLE">MOTORCYCLE</mat-option>
          <mat-option value="TRUCK">TRUCK</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field class="entry-field w-full" appearance="outline">
        <mat-label>Plate Number</mat-label>
        <input
          matInput
          formControlName="plateNumber"
          placeholder="ABC 1234"
          autocomplete="off"
          autocapitalize="characters"
          class="plate-input"
        >
      </mat-form-field>
    </div>

    <div class="rounded-md border border-slate-200 bg-slate-50 px-3 py-2">
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Rate and tags</p>
      <div class="mt-1 flex flex-col gap-1 sm:flex-row sm:flex-wrap sm:items-center sm:gap-x-5">
        <mat-checkbox
          [checked]="entryForm.get('rateType')?.value === 'OVERNIGHT'"
          (change)="entryForm.get('rateType')?.setValue($event.checked ? 'OVERNIGHT' : 'HOURLY')"
        >
          Overnight
        </mat-checkbox>
        <mat-checkbox [checked]="hasDiscount" (change)="onCheckboxChangePWD($event)" [disabled]="scpwdCheck">
          PWD/Senior
        </mat-checkbox>
        <mat-checkbox [checked]="isDelivery" (change)="onCheckboxChangeDelivery($event)" [disabled]="deliveryCheck">
          Delivery
        </mat-checkbox>
      </div>
    </div>

    <button
      class="mt-4 flex h-14 w-full items-center justify-center rounded-md bg-primary px-4 text-base font-bold text-white shadow-sm transition hover:bg-emerald-700 disabled:cursor-not-allowed disabled:bg-slate-400"
      type="submit"
      [disabled]="isSubmitting || entryForm.invalid"
    >
      {{ isSubmitting ? 'Saving Ticket...' : 'Enter Parking' }}
    </button>
  </form>
</div>
