<div class="h-full rounded-lg border border-slate-200 bg-white p-5 shadow-sm transition hover:border-slate-300">
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">{{ label }}</p>
      <p class="mt-2 text-2xl font-semibold text-text-900">{{ value }}</p>
    </div>

    <div [ngClass]="iconBgClass" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-md">
      <lucide-angular [img]="icon" class="h-5 w-5"></lucide-angular>
    </div>
  </div>
</div>
